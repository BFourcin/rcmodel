[project]
name = "rcmodel"
dynamic = ["version"]
description = "3R2C Resistor Capacitor Model for simplified building thermal simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dill>=0.3.6,<0.4",
    "filelock>=3.8.0,<4",
    "gymnasium>=0.26.3,<1",
    "matplotlib>=3.6.1,<4",
    "numpy==1.23.3",
    "pandas>=1.5.1,<2",
    "ray[rllib]==2.4.0",
    "torch>=1.12.0,<2",
    "torchdiffeq>=0.2.3,<0.3",
    "tqdm>=4.64.1,<5",
    "xitorch>=0.3.0,<0.4",
]

[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.pytest.ini_options]

minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pytest<8",
    "pytest-lazy-fixture>=0.6.3",
    "setuptools<81",
]
