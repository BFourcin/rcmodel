[project]
name = "rcmodel"
dynamic = ["version"]
description = "3R2C Resistor Capacitor Model for simplified building thermal simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dill>=0.3.6,<0.4",
    "filelock>=3.8.0,<4",
    "gymnasium>=0.26.3,<1",
    "matplotlib>=3.6.1,<4",
    "numpy==1.23.3",
    "pandas>=1.5.1,<2",
    "ray[rllib]==2.4.0",
    "torch>=1.12.0,<2",
    "torchdiffeq>=0.2.3,<0.3",
    "tqdm>=4.64.1,<5",
    "xitorch>=0.3.0,<0.4",
]

[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.pytest.ini_options]

minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest<8",
    "pytest-lazy-fixture>=0.6.3",
    "ruff>=0.16.8",
    "setuptools<81",
]

[tool.ruff]
line-length = 127
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports build __all__ dynamically from submodules, which ruff
# can't statically follow, so the re-imports look unused.
"__init__.py" = ["F401"]
# `metadata` is the standard Gymnasium Env class attribute; it's never mutated
# in place, just the expected shared dict per the gymnasium API.
"src/rcmodel/optimisation/environment.py" = ["RUF012"]
